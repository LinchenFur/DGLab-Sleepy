name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check Hugging Face configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$HF_TOKEN" || -z "$HF_SPACE" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Hugging Face deployment. Configure HF_TOKEN secret and HF_SPACE repository variable first."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create Space when missing
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          HfApi(token=os.environ["HF_TOKEN"]).create_repo(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              space_sdk="docker",
              private=False,
              exist_ok=True,
          )
          PY

      - name: Push current main branch to Space
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          owner="${HF_SPACE%%/*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add huggingface "https://${owner}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          git push --force huggingface HEAD:main
